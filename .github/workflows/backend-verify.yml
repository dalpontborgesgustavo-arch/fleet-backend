name: Backend verification

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/verify-applied-migrations.mjs
      - run: npm run build
      - run: node --check scripts/verify-backend-release.mjs
      - run: node scripts/compare-runtime-artifacts.mjs dist dist
      - run: npm test -- --runInBand --passWithNoTests src/environmental
