name: Backend verification

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/verify-applied-migrations.mjs
      - run: npm run build
      - run: node --check scripts/verify-backend-release.mjs
      - run: node scripts/compare-runtime-artifacts.mjs dist dist
      - run: npm test -- --runInBand
      # Release output is built on Linux from the exact main SHA, never on EC2.
      - name: Package verified Linux release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          tar -czf backend-release.tgz dist node_modules/.prisma/client prisma/schema.prisma package.json package-lock.json
          sha256sum backend-release.tgz > backend-release.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: backend-release-${{ github.sha }}
          path: |
            backend-release.tgz
            backend-release.sha256
          retention-days: 7

  additive-migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jr_migration_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jr_migration_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jr_migration_rehearsal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The historical migration chain cannot be replayed into an empty DB:
      # 20260722153000_add_bi_monthly_checklist_views references checklist.type.
      # Rehearse the new additive SQL alone, without changing past migrations.
      - run: npx prisma generate
      - run: npx prisma db execute --file prisma/migrations/20261019170000_add_ssma_work_cost_snapshots/migration.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/migrations/20261021170000_add_duda_bd_geral_staging/migration.sql --schema prisma/schema.prisma
      # The real User table already exists in production. The rehearsal database
      # is deliberately minimal, so create only the referenced key before the
      # additive per-user preference migration.
      - run: npx prisma db execute --file scripts/duda-bd-geral/rehearsal-user.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/migrations/20261021210000_add_duda_bd_geral_view_preference/migration.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/migrations/20261021223000_add_duda_bd_geral_manual_entries/migration.sql --schema prisma/schema.prisma
      - run: >-
          node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();db.ssmaWorkCostSnapshot.count().then(n=>{if(n!==0)process.exitCode=1;console.log("SSMA snapshot table readable:",n);}).catch(e=>{console.error(e);process.exitCode=1;}).finally(()=>db.$disconnect())'
      - run: >-
          node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();Promise.all([db.dudaBdGeralImport.count(),db.dudaBdGeralRow.count()]).then(([imports,rows])=>{if(imports!==0||rows!==0)process.exitCode=1;console.log("Duda staging readable:",imports,rows);}).catch(e=>{console.error(e);process.exitCode=1;}).finally(()=>db.$disconnect())'
      - run: >-
          node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();db.dudaBdGeralViewPreference.count().then(n=>{if(n!==0)process.exitCode=1;console.log("Duda preferences readable:",n);}).catch(e=>{console.error(e);process.exitCode=1;}).finally(()=>db.$disconnect())'
      - run: >-
          node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();Promise.all([db.dudaBdGeralManualEntry.count(),db.dudaBdGeralManualEntryRevision.count()]).then(([entries,revisions])=>{if(entries!==0||revisions!==0)process.exitCode=1;console.log("Duda manual audit readable:",entries,revisions);}).catch(e=>{console.error(e);process.exitCode=1;}).finally(()=>db.$disconnect())'
      - run: node scripts/duda-bd-geral/smoke_test.mjs
      - run: npm run build
      - run: node scripts/duda-bd-geral/smoke_manual.cjs
